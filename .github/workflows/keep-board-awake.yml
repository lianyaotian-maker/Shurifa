# 草原小屋 · 让月亮上的留言板保持“醒着”
# 1. Supabase 免费项目连续 7 天没人访问会被暂停。这里每 3 天自动读一次留言表，避免暂停。
#    只读取，不写入、不修改任何留言。用的是本来就公开在网页里的 publishable key。
# 2. GitHub 在公开仓库 60 天没有动静时，会自动停掉定时任务。这里每次运行都通过 GitHub 接口
#    把本任务和留言备份任务“重新启用”一次，60 天的计时就会重新开始（不会产生任何提交）。
name: Keep message board awake

on:
  schedule:
    - cron: "17 3 */3 * *"   # 每 3 天一次（北京时间 11:17 左右）
  workflow_dispatch: {}       # 也可以在 Actions 页面手动运行

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from the message board
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://cfmwjckfjddjxpnexomo.supabase.co/rest/v1/messages?select=id&limit=1" \
              -H "apikey: sb_publishable_xE5zxI7PTUFAFGNnH1wMhA_buM1tsUI")
            echo "Supabase responded with HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1

      - name: Keep the scheduled workflows enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in keep-board-awake.yml board-snapshot.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" \
              && echo "Re-enabled $wf" || echo "Could not re-enable $wf"
          done
