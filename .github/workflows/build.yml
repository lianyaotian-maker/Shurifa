name: Build
on:
  push:
  workflow_dispatch:

env:
  CI_NAME: Worldword CI
jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      BUILD_ABI: armeabi-v7a,arm64-v8a
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
            ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v6
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-worldword-jni-debug-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Build debug Worldword
        run: |
          make debug

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        shell: bash
        run: cp -R app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib app/prebuilt

      - name: Upload APK artifact (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: worldword-arm64-v8a
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          retention-days: 90

      - name: Upload APK artifact (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: worldword-armeabi-v7a
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
          retention-days: 90
