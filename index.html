<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="草原小屋">
<meta name="theme-color" content="#3b3157">
<meta name="description" content="黄昏的草原上，有一间亮着灯的小木屋。">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>草原小屋</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
<div id="view"></div>

<div id="hud">
  <div id="datebar">
    <button id="prev" class="step" aria-label="前一天">‹</button>
    <div class="mid">
      <div id="dateLabel" aria-live="polite"></div>
      <div id="slider" role="slider" tabindex="0" aria-label="日期" aria-valuemin="0" aria-valuemax="364">
        <div class="track"></div>
        <div id="thumb"></div>
      </div>
      <div class="months" aria-hidden="true"><span style="left:0%">1月</span><span style="left:24.7%">4月</span><span style="left:49.7%">7月</span><span style="left:75%">10月</span></div>
    </div>
    <button id="next" class="step" aria-label="后一天">›</button>
    <button id="dn" class="step" aria-label="进入夜晚" aria-pressed="false">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.4 6.4 0 0 0 10.5 10.5z"/></svg>
    </button>
  </div>
  <button id="quality" class="chip">画质 · 均衡</button>
  <button id="help" class="chip" aria-label="操作说明">?</button>
  <button id="sound" class="chip" aria-label="声音开关">有声</button>
  <div id="joy" aria-hidden="true"><div id="knob"></div></div>
  <button id="jump" aria-label="跳">跳</button>
</div>

<div id="hint" aria-hidden="true">
  <div class="h left"><b>左边按住拖动</b>走路</div>
  <div class="h right"><b>右边滑动</b>环顾四周<br><b>点一点</b>看看会发生什么</div>
</div>
<div id="seat" aria-live="polite"></div>
<div id="spicy" aria-hidden="true"></div>
<div id="pops" aria-live="polite"></div>
<div id="musicbox" hidden role="dialog" aria-label="八音盒">
  <div class="card">
    <div class="mb-head"><b>八音盒</b><span id="mbNow">没有在放歌</span></div>
    <div id="mbList"></div>
    <div class="mb-foot">
      <button id="mbStop">停止播放</button>
      <button id="mbClose">收起</button>
    </div>
  </div>
</div>
<div id="board" hidden role="dialog" aria-label="留言板">
  <div class="card">
    <div class="bd-head"><b>草原留言板</b><button id="bdClose" aria-label="收起留言板">收起</button></div>
    <div class="bd-body">
    <div id="bdList"></div>
    <div class="bd-form">
      <input id="bdName" maxlength="20" placeholder="署名（可以不写）" autocomplete="off">
      <textarea id="bdText" maxlength="300" rows="3" placeholder="想说点什么？写下来挂在留言板上"></textarea>
      <div class="bd-foot"><span id="bdState" aria-live="polite"></span><button id="bdSend">挂上去</button></div>
    </div>
    </div>
  </div>
</div>
<div id="toast" aria-live="polite"></div>
<div id="moonfade" aria-hidden="true"></div>
<div id="letter" hidden role="dialog" aria-label="一封信">
  <div class="paper">
    <p>I hope this isn’t just a play</p>
    <button id="letterClose" aria-label="收起信">收起</button>
  </div>
</div>
<div id="flash" aria-hidden="true"></div>
<div id="sparks" aria-hidden="true"></div>

<div id="start">
  <div class="card">
    <h1>草原小屋</h1>
    <p class="sub">黄昏的草原上，有一间亮着灯的小木屋。</p>
    <p id="status">正在准备…</p>
    <button id="go" hidden>走进草原</button>
    <p class="tips">左手走路 · 右手环顾 · 拨动上方的日期，看看草原的四季<br>看到闪光的小星星，就点一点 · 摸摸小猫会有声音</p>
    <p class="credits"><a href="sounds/CREDITS.txt" target="_blank" rel="noopener">声音素材致谢</a></p>
    <p id="a2hs" hidden>想全屏玩：在 Safari 点「分享」→「添加到主屏幕」</p>
  </div>
</div>
</div>
<noscript><p style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;margin:0">需要开启 JavaScript 才能进入草原。</p></noscript>

<script src="js/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/config.js"></script>
<script src="js/season.js"></script>
<script src="js/field.js"></script>
<script src="js/shaders.js"></script>
<script src="js/post.js"></script>
<script src="js/nature.js"></script>
<script src="js/trees.js"></script>
<script src="js/house.js"></script>
<script src="js/interior.js"></script>
<script src="js/fx.js"></script>
<script src="js/party.js"></script>
<script src="js/audio.js"></script>
<script src="js/things.js"></script>
<script src="js/things2.js"></script>
<script src="js/cat.js"></script>
<script src="js/life.js"></script>
<script src="js/night.js"></script>
<script src="js/moon.js"></script>
<script src="js/moon2.js"></script>
<script src="js/fireflies.js"></script>
<script src="js/board.js"></script>
<script src="js/player.js"></script>
<script src="js/main.js"></script>
</body>
</html>
